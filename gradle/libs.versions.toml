[versions]
kotlin = "2.1.0"
coroutines = "1.10.1"
serialization = "1.8.0"
dex2jar = "2.4.21"
okhttp = "5.0.0-alpha.14"
rhino = "1.7.15"
multiplatform-settings = "1.1.0"

[libraries]
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "coroutines" }

serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Dependency Injection
kodein = "org.kodein.di:kodein-di-conf-jvm:7.22.0"

# Logging
logback = "ch.qos.logback:logback-classic:1.5.6"
kotlinlogging = "io.github.oshai:kotlin-logging-jvm:7.0.14"

# ReactiveX
rxjava = "io.reactivex:rxjava:1.3.8"
rxkotlin = "io.reactivex:rxkotlin:1.0.0"

# JSoup
jsoup = "org.jsoup:jsoup:1.18.3"

# Dependency of :AndroidCompat:Config
typesafe_config = "com.typesafe:config:1.4.3"
config4k = "io.github.config4k:config4k:0.7.0"

# dex2jar
dex-translator = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
dex-tools = { module = "de.femtopedia.dex2jar:dex-tools", version.ref = "dex2jar" }

# APK parser
apk-parser = "net.dongliu:apk-parser:2.6.10"

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-dns-over-https = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okio = "com.squareup.okio:okio:3.9.0"

# dependencies of Tachiyomi extensions
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version = "4135455a2a" }
quickjs = "app.cash.quickjs:quickjs-jvm:0.9.2"

xmlpull = "xmlpull:xmlpull:1.1.3.4a"
apksig = "com.android.tools.build:apksig:7.1.2"
androidx-annotation = "androidx.annotation:annotation:1.8.0"
rhino-runtime = { module = "org.mozilla:rhino-runtime", version.ref = "rhino" }
rhino-engine = { module = "org.mozilla:rhino-engine", version.ref = "rhino" }
multiplatform-settings-jvm = { module = "com.russhwolf:multiplatform-settings-jvm", version.ref = "multiplatform-settings" }
multiplatform-settings-serialization-jvm = { module = "com.russhwolf:multiplatform-settings-serialization-jvm", version.ref = "multiplatform-settings" }
icu4j = "com.ibm.icu:icu4j:75.1"

android-jar = "com.github.Claudemirovsky:android-jar:2.0.0"
jackson-annotations = "com.fasterxml.jackson.core:jackson-annotations:2.17.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Linter
kotlinter = { id = "org.jmailen.kotlinter", version = "5.0.1" }

# Build config
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.0.7" }

# ShadowJar
shadowjar = { id = "com.github.johnrengelman.shadow", version = "8.1.1" }

[bundles]
common = [
    "kotlin-stdlib-jdk8",
    "kotlin-reflect",
    "coroutines-core",
    "coroutines-jdk8",
    "serialization-json",
    "serialization-protobuf",
    "kodein",
    "logback",
    "kotlinlogging",
    "rxjava",
    "rxkotlin",
    "jsoup",
    "typesafe_config",
    "config4k",
    "dex-translator",
    "dex-tools",
    "apk-parser",
]
okhttp = [
    "okhttp",
    "okhttp-logging-interceptor",
    "okhttp-dns-over-https",
    "okhttp-brotli",
    "okio"
]
tachiyomi = [
    "injekt-core",
    "quickjs",
]
androidcompat-implementation = [
    "rhino-runtime",
    "rhino-engine",
    "multiplatform-settings-jvm",
    "multiplatform-settings-serialization-jvm",
    "icu4j",
    "android-jar",
    "jackson-annotations",
]
androidcompat-compileonly = [
    "xmlpull",
    "apksig",
    "androidx-annotation",
]